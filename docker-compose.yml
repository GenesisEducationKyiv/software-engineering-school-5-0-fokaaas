name: weather-api

services:
  gateway:
    image: stbasarab/gateway-micro:latest
    restart: always
    container_name: gateway
    ports:
      - "3000:4558"
    depends_on:
      - weather
      - subscription
      - email
    networks:
      - weather-api-net
    env_file:
      - ~/.env.gateway

  weather:
    image: stbasarab/weather-micro:latest
    restart: always
    container_name: weather
    depends_on:
      - redis
      - pushgateway
    networks:
      - weather-api-net
    env_file:
      - ~/.env.weather
    volumes:
      - ~/logs:/app/logs

  subscription:
    image: stbasarab/subscription-micro:latest
    restart: always
    container_name: subscription
    depends_on:
      - postgres
      - redis
    networks:
      - weather-api-net
    env_file:
      - ~/.env.subscription

  notification:
    image: stbasarab/notification-micro:latest
    restart: always
    container_name: notification
    depends_on:
      - rabbitmq
    networks:
      - weather-api-net
    env_file:
      - ~/.env.notification

  email:
    image: stbasarab/email-micro:latest
    restart: always
    container_name: email
    depends_on:
      - rabbitmq
    networks:
      - weather-api-net
    env_file:
      - ~/.env.email

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    volumes:
      - ~/postgres/data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    env_file:
      - ~/.env.postgres
    networks:
      - weather-api-net

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - weather-api-net

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: always
    ports:
      - "15672:15672"
    networks:
      - weather-api-net

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: otel-lgtm
    restart: always
    ports:
      - "3000:3000"
    networks:
      - weather-api-net

networks:
  weather-api-net:
    driver: bridge
